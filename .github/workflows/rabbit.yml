name: Refresh rabbit contribution graph

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rabbit SVG from live contribution data
        run: python3 generate_rabbit.py
        env:
          GH_USERNAME: Mottii

      - name: Commit if the graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rabbit-contributions.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh rabbit contribution graph"
            git push
          fi
